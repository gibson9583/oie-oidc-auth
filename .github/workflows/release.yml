name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17', cache: maven}
      - name: Check SSL.com signing configuration
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CERT_SHA256: ${{ vars.SSL_COM_CERT_SHA256 }}
        run: python3 .github/signing/sign_release.py --check-config

      - name: Verify version
        run: test "${GITHUB_REF_NAME#v}" = "$(jq -r .version oie.json)"
      - name: Download OIE build dependencies
        run: |
          curl -fSL -o oie.tar.gz https://github.com/OpenIntegrationEngine/engine/releases/download/v4.6.0-rc1/oie_unix_4_6_0-rc1.tar.gz
          tar xzf oie.tar.gz
          echo "OIE_HOME=$GITHUB_WORKSPACE/oie" >> "$GITHUB_ENV"
      - name: Build
        run: mvn -B -ntp clean package
      - name: Sign and verify release JARs with SSL.com
        env:
          SSL_COM_USERNAME: ${{ secrets.SSL_COM_USERNAME }}
          SSL_COM_PASSWORD: ${{ secrets.SSL_COM_PASSWORD }}
          SSL_COM_CREDENTIAL_ID: ${{ secrets.SSL_COM_CREDENTIAL_ID }}
          SSL_COM_TOTP_SECRET: ${{ secrets.SSL_COM_TOTP_SECRET }}
          SSL_COM_CERT_SHA256: ${{ vars.SSL_COM_CERT_SHA256 }}
        run: python3 .github/signing/sign_release.py

      - uses: softprops/action-gh-release@v2
        with:
          files: target/oidcauth-*.zip
